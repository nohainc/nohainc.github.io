<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} — {% endif %}Nano Markup</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="google-site-verification" content="1s8_lB6hVVjf0acFB83gc5jua-KLyHFZhJv0ERTA4eA">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% if page.title %}{{ page.title }} — {% endif %}Nano Markup">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:site_name" content="Nano Markup">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#17211b">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Nano Markup",
      "url": "{{ '/' | absolute_url }}",
      "description": {{ site.description | jsonify }},
      "sameAs": [
        "https://github.com/nohainc/nanomarkup.spec",
        "https://github.com/nohainc/nanomarkup.python",
        "https://github.com/nohainc/nanomarkup.go",
        "https://github.com/nohainc/nanomarkup.javascript"
      ]
    }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Nano Markup home">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span>Nano Markup</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="{{ '/specification.html' | relative_url }}">Specification</a>
        <a href="{{ '/implementations.html' | relative_url }}">Implementations</a>
        <a href="https://github.com/nohainc/nanomarkup.spec/tree/v1.0.0/examples">Examples</a>
        <a href="https://github.com/nohainc/nanomarkup.spec">GitHub</a>
      </nav>
    </header>
    <main id="main-content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <p><strong>Nano Markup</strong> <span>Version {{ site.version }}</span></p>
      <p><a href="https://github.com/nohainc/nanomarkup.spec/blob/v1.0.0/LICENSE">CC BY 4.0</a> · <a href="https://github.com/nohainc/nanomarkup.spec/blob/v1.0.0/ERRATA.md">Errata</a> · <a href="https://github.com/nohainc/nanomarkup.spec/blob/v1.0.0/SECURITY.md">Security</a></p>
    </footer>
  </body>
</html>
