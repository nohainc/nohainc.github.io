name: Website CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec jekyll build --strict_front_matter
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python tests/validate_site.py _site
